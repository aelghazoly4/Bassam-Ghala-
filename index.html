:root{
  /* phone column: exactly 9:16 on wide screens, full width on phones */
  --sw: min(100vw, calc(100dvh * 0.5628));
  --u: calc(var(--sw) / 366);          /* UI chrome unit */
  --k: 1;                              /* canvas scale, set by JS */
  --ease: cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#e8dfd4;font-family:'Amiri',serif;color:#59391d;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
img{display:block;width:100%;height:100%;-webkit-user-drag:none}
.backdrop{position:fixed;inset:-40px;background:url(assets/inv/bg.webp) center/cover;filter:blur(30px) saturate(.9);opacity:.7}

.stage{position:fixed;top:0;bottom:0;left:50%;width:var(--sw);transform:translateX(-50%);overflow:hidden;background:#efe6dc;touch-action:none;box-shadow:0 0 60px rgba(90,60,30,.18)}

.stage.opening .bg,.stage.opened .bg{transform:scale(1)}

/* ===== intro: pearl double doors opening in 3D ===== */
.intro{position:absolute;inset:0;z-index:30;transition:opacity .8s ease}
.intro.done{opacity:0;pointer-events:none}
.dcv{position:absolute;left:50%;top:50%;width:705.75px;height:1254px;
  transform:translate(-50%,-50%) scale(calc(var(--k) * var(--push,1)));
  perspective:1150px;perspective-origin:50% 49%}
.intro.swing .dcv{--push:1.24;transition:transform 2.7s cubic-bezier(.55,.05,.3,1)}
.room{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse 60% 55% at 50% 48%,rgba(255,250,240,.0),rgba(70,48,26,.28))}
.intro.swing .room{opacity:1}
.intro.gone .room{opacity:0;transition-duration:1.2s}
.door{position:absolute;top:0;height:100%;width:352.875px;transform-style:preserve-3d;
  transition:transform 2.15s cubic-bezier(.62,.02,.32,1)}
.door.dl{left:0;transform-origin:0 50%}
.door.dr{right:0;transform-origin:100% 50%}
.intro.swing .door.dl{transform:rotateY(-86deg)}   /* outward: the meeting edges swing toward the viewer */
.intro.swing .door.dr{transform:rotateY(86deg)}
.door .face{position:absolute;inset:0;background:url(assets/inv/doors.webp) no-repeat;background-size:705.75px 1254px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dl .face{background-position:0 0}
.dr .face{background-position:-352.875px 0}
.door .shade{position:absolute;inset:0;opacity:0;transition:opacity 2.15s cubic-bezier(.62,.02,.32,1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dl .shade{background:linear-gradient(90deg,rgba(255,252,245,.10),rgba(90,62,35,.30))}
.dr .shade{background:linear-gradient(270deg,rgba(60,40,22,.30),rgba(60,40,22,.62))}
.intro.swing .door .shade{opacity:1}
/* door thickness on the meeting edges */
.door .edge{position:absolute;top:0;height:100%;width:13px;
  background:linear-gradient(90deg,#cdbda5,#ece2d3 40%,#dfd2bf 70%,#bfac90);
  box-shadow:inset 0 0 0 1px rgba(150,120,85,.25)}
.dl .edge{left:352.875px;transform-origin:0 50%;transform:rotateY(90deg)}
.dr .edge{left:-13px;transform-origin:100% 50%;transform:rotateY(-90deg)}
/* light leaking through the seam right before the doors part */
.seam{position:absolute;left:50%;top:0;bottom:0;width:140px;margin-left:-70px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,246,226,.35) 44%,rgba(255,252,242,.85) 50%,rgba(255,246,226,.35) 56%,transparent);
  -webkit-mask:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(transparent,#000 18%,#000 82%,transparent);
  filter:blur(5px);transform:scaleX(.25);transition:opacity .5s ease,transform .6s ease;mix-blend-mode:screen}
.intro.opening .seam{opacity:.75;transform:scaleX(.45)}
.intro.swing .seam{opacity:0;transform:scaleX(1.8);transition:opacity .8s ease .1s,transform 1s ease}
/* idle shimmer across the pearls */
.sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity .4s ease}
.sheen::before{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28) 45%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.28) 55%,transparent);
  transform:skewX(-12deg);mix-blend-mode:soft-light;animation:sweep 5.5s ease-in-out 1.2s infinite}
@keyframes sweep{0%{left:-60%}55%,100%{left:125%}}
.medal-glow{position:absolute;left:50%;top:48.8%;width:300px;height:330px;margin:-165px 0 0 -150px;pointer-events:none;

.intro.opening .sheen,.intro.opening .medal-glow{opacity:0;animation:none}
.open-wrap{position:absolute;left:0;right:0;bottom:calc(84 * var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u));transition:opacity .5s ease,transform .5s ease}

.open-line{display:flex;align-items:center;width:calc(92 * var(--u))}

.open-btn{width:calc(205 * var(--u));height:calc(38 * var(--u));border-radius:999px;border:1px solid rgba(214,200,182,.9);background:linear-gradient(#fffdf9,#f7f1e8);box-shadow:0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(120,95,70,.18),inset 0 1px 0 #fff;font-family:'Amiri',serif;font-size:calc(13.5 * var(--u));color:#4d3a28;cursor:pointer;animation:breathe 2.6s ease-in-out infinite}

.sec{position:absolute;inset:0;visibility:hidden;pointer-events:none}

.cu .num{position:relative;height:40px;width:90px;overflow:hidden;margin-top:-2px}
.cu .num b{position:absolute;left:0;right:0;top:0;font-family:'Amiri',serif;font-weight:700;font-size:33px;line-height:40px;color:#59391d;direction:ltr}
.cu .num b.out{animation:numOut .3s ease-in forwards}
.cu .num b.in{animation:numIn .45s .18s var(--ease) both}
@keyframes numOut{to{transform:translateY(-60%);opacity:0;filter:blur(3px)}}
@keyframes numIn{from{transform:translateY(60%);opacity:0;filter:blur(3px)}}
.cu .lab{margin-top:5px;font-family:'Amiri',serif;font-size:17.5px;line-height:20px;color:#94714f}
.csep{position:absolute;top:623px;width:8px;height:8px;color:#b89a73}

@media (prefers-reduced-motion: reduce){.rv{filter:none}.sec.in .rv{transition-duration:.4s}}

    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5A6 6 0 0 0 2 7.5V12a2 2 0 0 0 2 2h1.2a.8.8 0 0 0 .8-.8V9.6a.8.8 0 0 0-.8-.8H3.4V7.5a4.6 4.6 0 0 1 9.2 0v1.3h-1.8a.8.8 0 0 0-.8.8v3.6c0 .44.36.8.8.8H12a2 2 0 0 0 2-2V7.5a6 6 0 0 0-6-6z"/></svg>

<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>

<script>
(() => {
  /* ---------- editable details ---------- */
  const EVENT = {
    start: new Date(2026, 10, 10, 19, 30, 0),          // الثلاثاء 10 نوفمبر 2026 — 7:30 م
    mapUrl: 'https://maps.google.com/?cid=10913639334945655083'      // قصر بصمات للاحتفالات — الحزم، الرياض
  };

  const $ = s => document.querySelector(s);
  const stage = $('#stage'), cv = $('#cv');
  const secs = [...document.querySelectorAll('.sec')];
  const LAST = secs.length - 1;
  const music = $('#music'), audioBtn = $('#audioBtn');

  /* ---------- canvas scale: cover the stage, exactly like the 9:16 PDF page ---------- */
  function fit() {
    const r = stage.getBoundingClientRect();
    const k = Math.max(r.width / 705.75, r.height / 1254);
    document.documentElement.style.setProperty('--k', k);
  }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));

  /* ---------- audio ---------- */
  function setAudio(on) {
    if (on) {
      music.volume = 0;
      music.play().then(() => {
        audioBtn.classList.remove('muted');
        const t0 = performance.now();
        const ramp = now => { const k = Math.min(1, (now - t0) / 1800); music.volume = k * k; if (k < 1 && !music.paused) requestAnimationFrame(ramp); };
        requestAnimationFrame(ramp);
      }).catch(() => audioBtn.classList.add('muted'));
    }
    else { music.pause(); audioBtn.classList.add('muted'); }
  }
  audioBtn.addEventListener('click', e => { e.stopPropagation(); setAudio(music.paused); });
  // recover from a media hiccup (flaky network / decoder) while music is meant to be on
  let wantMusic = false, retries = 0, lastT = 0;
  music.addEventListener('play', () => { wantMusic = true; });
  audioBtn.addEventListener('click', () => { wantMusic = !music.paused; });
  music.addEventListener('timeupdate', () => { if (music.currentTime > 0) lastT = music.currentTime; });
  music.addEventListener('error', () => {
    if (!wantMusic || retries++ >= 3) return;
    setTimeout(() => {
      music.load();
      music.addEventListener('loadedmetadata', () => { try { music.currentTime = lastT; } catch (_) {} }, { once: true });
      music.play().then(() => audioBtn.classList.remove('muted')).catch(() => {});
    }, 400);
  });

  /* ---------- intro: open the doors ---------- */
  const intro = $('#intro');
  let opened = false;
  function openDoors() {
    if (opened) return;
    opened = true;
    setAudio(true);
    intro.classList.add('opening');                       // button fades, light at the seam
    setTimeout(() => {
      intro.classList.add('swing');                       // doors swing in, camera pushes forward
      stage.classList.add('opening');                     // room behind settles from zoomed-in
    }, 380);
    setTimeout(() => { intro.classList.add('gone', 'done'); stage.classList.add('opened'); }, 2350);
    setTimeout(() => show(0, 1), 2750);
    setTimeout(() => intro.remove(), 3400);
  }
  $('#openBtn').addEventListener('click', openDoors);
  intro.addEventListener('click', openDoors);

  /* ---------- section engine ---------- */
  let cur = -1, busy = false;
  function show(i, dir) {
    const el = secs[i];
    el.classList.remove('leave-up', 'leave-down', 'in', 'from-up');
    if (dir < 0) el.classList.add('from-up');
    el.classList.add('active');
    void el.offsetWidth;
    el.classList.add('in');
    cur = i;
    stage.classList.toggle('show-hint', i < LAST);
  }
  function go(dir) {
    const next = cur + dir;
    if (busy || cur < 0 || next < 0 || next > LAST) return;
    busy = true;
    const old = secs[cur];
    old.classList.add(dir > 0 ? 'leave-up' : 'leave-down');
    old.classList.remove('active');
    setTimeout(() => { old.classList.remove('leave-up', 'leave-down', 'from-up', 'in'); show(next, dir); }, 520);
    setTimeout(() => { busy = false; }, 1250);
  }

  let acc = 0, accT;
  addEventListener('wheel', e => {
    e.preventDefault();
    if (busy) { acc = 0; return; }
    acc += e.deltaY;
    clearTimeout(accT); accT = setTimeout(() => acc = 0, 180);
    if (Math.abs(acc) > 35) { go(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive: false });

  let ty = null, tx = 0;
  stage.addEventListener('touchstart', e => { ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  stage.addEventListener('touchend', e => {
    if (ty === null) return;
    const dy = ty - e.changedTouches[0].clientY, dx = tx - e.changedTouches[0].clientX;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) go(dy > 0 ? 1 : -1);
    ty = null;
  });

  addEventListener('keydown', e => {
    if (!stage.classList.contains('opened')) { if (e.key === 'Enter' || e.key === ' ') openDoors(); return; }
    if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  });
  $('#hint').addEventListener('click', () => go(1));

  /* ---------- map / directions ---------- */
  document.querySelectorAll('[data-map]').forEach(a => {
    a.href = EVENT.mapUrl; a.target = '_blank'; a.rel = 'noopener';
  });

  /* ---------- live countdown ---------- */
  const units = {};
  document.querySelectorAll('.cu').forEach(u => { units[u.dataset.unit] = { box: u.querySelector('.num'), v: null }; });
  function setUnit(u, v, animate) {
    if (u.v === v) return;
    const old = u.box.querySelector('b:not(.out)');
    const nb = document.createElement('b'); nb.textContent = v;
    if (animate && old) {
      old.classList.add('out'); setTimeout(() => old.remove(), 320);
      nb.classList.add('in');
    } else if (old) old.remove();
    u.box.appendChild(nb); u.v = v;
  }
  let first = true;
  function tick() {
    let s = Math.max(0, Math.floor((EVENT.start - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    const vals = { d: String(d).padStart(2, '0'), h: String(h).padStart(2, '0'), m: String(m).padStart(2, '0'), s: String(s).padStart(2, '0') };
    const live = cur === LAST && !first;
    for (const k in vals) setUnit(units[k], vals[k], live);
    first = false;
  }
  tick(); setInterval(tick, 1000);

  // ?s=N opens page N directly (handy for previewing)
  const jump = new URLSearchParams(location.search).get('s');
  if (jump !== null) { opened = true; intro.remove(); stage.classList.add('opened'); show(Math.min(LAST, Math.max(0, +jump || 0)), 1); }

  if (new URLSearchParams(location.search).has('autoopen')) setTimeout(openDoors, 1000);   // preview helper

  // warm up images
  document.querySelectorAll('.el img').forEach(img => { img.loading = 'eager'; img.decoding = 'async'; });
})();
</script>
